# FreshRSS reader: standalone nginx container.
# - serves the app files (./www folder, updated by deploy.sh)
# - proxies /api/ to FreshRSS: to the browser everything comes from the same origin (no CORS)
# Usage: copy .env.example to .env, put the app files in ./www, then: docker compose up -d
services:
  reader:
    image: nginx:1.27-alpine
    container_name: lightning-reader
    restart: unless-stopped
    ports:
      - "8095:80"   # point your reverse proxy at http://<host-ip>:8095
    environment:
      # FreshRSS address as seen from this container, no trailing slash (set in .env)
      FRESHRSS_UPSTREAM: ${FRESHRSS_UPSTREAM:?set FRESHRSS_UPSTREAM in .env}
    volumes:
      - ./www:/usr/share/nginx/html:ro
      # the official nginx image substitutes ${VARIABLES} in /etc/nginx/templates/*.template at startup
      - ./nginx:/etc/nginx/templates:ro
