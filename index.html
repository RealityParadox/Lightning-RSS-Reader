<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lightning RSS Reader</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" href="app-192.png">
<link rel="apple-touch-icon" href="app-512.png">
<meta name="theme-color" content="#0f1419">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--dim:#6b7a88;--acc:#0b7285;--line:#d9e0e6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#171e26;--ink:#e6edf3;--dim:#8b9aa8;--acc:#4cc9d8;--line:#26303a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
#hd{position:sticky;top:0;z-index:5;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
#views{display:flex;gap:4px}
.vb{position:relative;background:none;border:0;padding:6px 10px;border-radius:10px;color:var(--dim)}
.vb svg{display:block;width:24px;height:24px}
.vb.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
#count{position:absolute;top:-2px;right:-2px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:var(--bg);font:700 11px/16px system-ui,sans-serif;text-align:center}
#ver{margin-left:auto;margin-right:4px;color:var(--dim);font-size:11px}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:none;border:0;padding:8px;color:var(--acc);font-weight:600}
.ic svg{display:block;width:26px;height:26px}
#list article{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
#list article b{display:block;font-size:17px;line-height:1.3;margin-bottom:4px}
#list article .ex{color:var(--dim);font-size:14px;line-height:1.35;margin:2px 0 6px}
#list article small{color:var(--dim)}
#list article{display:flow-root}
#list article .th{float:left;width:96px;height:96px;margin:0 12px 6px 0;object-fit:cover;border-radius:8px;background:var(--line)}
#list article.read{opacity:.45}
#list{overflow-x:clip}
#list article{touch-action:pan-y;user-select:none;-webkit-user-select:none}
#list article.starred b::before{content:'★ ';color:var(--acc)}
#list article.sw{position:relative;box-shadow:-100vw 0 0 0 var(--acc)}
#list article.sw::before{content:'★';position:absolute;left:-56px;top:50%;transform:translateY(-50%);font-size:26px;color:#fff;opacity:.55}
#list article.sw.full::before{opacity:1}
#list article.swl{position:relative;box-shadow:100vw 0 0 0 #5b6b7a}
#list article.swl::after{content:'Labels';position:absolute;left:100%;margin-left:14px;top:50%;transform:translateY(-50%);font:700 13px system-ui,sans-serif;color:#fff;opacity:.55}
#list article.swl.full::after{opacity:1}
#sheet .pn>b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fsheet .pn>b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
html{height:100%}
body{display:flex;flex-direction:column;min-height:100%}
#end{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 20px calc(14px + env(safe-area-inset-bottom,0px))}
#sync{order:2;position:sticky;z-index:6;top:calc(var(--vh,100vh) - var(--bh,70px) - 14px - env(safe-area-inset-bottom,0px));width:100%;max-width:420px;padding:20px;font-size:19px;font-weight:700;border:0;border-radius:14px;background:var(--acc);color:#fff;box-shadow:0 6px 20px #0006}
#sync:disabled{opacity:.6}
#sync{display:flex;align-items:center;justify-content:center;gap:14px}
#sync svg{display:block;width:28px;height:28px}
#sync .pl{font-size:22px;font-weight:700;opacity:.7;line-height:1}
#sp{order:3;flex:none;width:100%;height:0;margin-top:-14px}
#end p{order:1;margin:0;color:var(--dim);font-size:14px;text-align:center}
#bar.full,#tbar.full{height:10px}
#tbar{position:fixed;left:0;top:0;height:5px;transition:height .12s;width:0;background:var(--acc);z-index:20}
#bar{position:fixed;left:0;bottom:0;height:5px;transition:height .12s;width:0;background:var(--acc);z-index:20}
#art{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;overscroll-behavior-y:contain;display:none}
#art.on{display:block}
#art .in{max-width:680px;margin:0 auto;padding:18px 18px 80px;font:19px/1.65 system-ui,sans-serif}
#art h1{font:700 26px/1.25 system-ui,sans-serif;margin:8px 0}
#art .meta{font:14px system-ui,sans-serif;color:var(--dim);margin-bottom:20px}
#art img,#art video{max-width:100%;height:auto}
#art a{color:var(--acc)}
#art h1 a{color:inherit;text-decoration:none}
#art pre{overflow:auto}
#art .hint{font:14px system-ui,sans-serif;color:var(--dim);text-align:center;margin:40px 0 0}
#art .in *{position:static!important;float:none!important;max-width:100%}
#art table{display:block;overflow:auto}
#tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tb button,#tb a{flex:1;padding:16px 0;border:0;background:none;color:var(--ink);display:flex;justify-content:center}
#tb svg{display:block;width:24px;height:24px}
#tb button.on{color:var(--acc)}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#fsheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#fsheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:#0008}
#fsheet .bk{position:absolute;inset:0;background:#0008}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
#fsheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
#sheet label{display:flex;gap:12px;align-items:center;padding:12px 4px;font-size:17px}
#fsheet label{display:flex;gap:12px;align-items:center;padding:12px 4px;font-size:17px}
#sheet input{width:22px;height:22px}
#fsheet input{width:22px;height:22px}
#sheet .pn>button{margin-top:8px;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:700 16px system-ui,sans-serif}
#fsheet .pn>button{margin-top:8px;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:700 16px system-ui,sans-serif}
#login{width:100%;max-width:340px;margin:20vh auto;padding:20px;display:none;flex-direction:column;gap:10px}
#login input{padding:12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#login button{padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none;font-size:14px}
/* loading indicator: thin bar at the top of the window + spinning refresh icon */
#load{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
html.loading #load{opacity:1;transition:opacity .15s .25s}
#load::before{content:'';position:absolute;top:0;bottom:0;width:40%;background:var(--acc);animation:slide 1.1s ease-in-out infinite}
html.loading #top svg{animation:spin 1s linear infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
/* options page */
#opts{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto}
#opts.on{display:block}
#opts .obar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:0 8px;height:48px;background:var(--bg);border-bottom:1px solid var(--line)}
#opts .obody{max-width:640px;margin:0 auto;padding:8px 16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--dim);margin-top:2px;line-height:1.35}
.opt select{flex:none;font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tgl{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;margin:0;transition:background .15s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tgl:checked{background:var(--acc)}
.tgl:checked::after{left:21px}
/* toolbar position (options): html.hdb = list toolbar at the bottom, html.tbt = article toolbar at the top */
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--acc);color:var(--bg);font-weight:600}
html.hdb #hd{order:9;top:auto;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-bottom:0;border-top:1px solid var(--line)}
html.hdb:has(#end[hidden]) #hd{margin-top:auto}
html.hdb #end{padding-bottom:14px}
html.hdb #sync{top:calc(var(--vh,100vh) - var(--bh,70px) - 14px - 48px - env(safe-area-inset-bottom,0px))}
html.tbt #tb{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0;padding-top:env(safe-area-inset-top,0px)}
html.tbt #art .in{padding-top:calc(18px + 57px + env(safe-area-inset-top,0px))}
/* popups opened from a toolbar placed at the top are shown at the top */
#sheet.top .pn,#fsheet.top .pn{top:0;bottom:auto;border-radius:0 0 16px 16px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
#left{display:contents}
#split{display:none}
@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  body{display:block;min-height:0}
  #left{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--lw,420px);overflow-y:auto;background:var(--bg)}
  #left>*{flex:none}
  #split{display:block;position:fixed;top:0;bottom:0;left:calc(var(--lw,420px) - 4px);width:8px;cursor:col-resize;z-index:8}
  #split:hover,#split.drag{background:color-mix(in srgb,var(--acc) 35%,transparent)}
  html:not(.ready) #split,html:not(.ready) #art{display:none}
  #art,#art.on{display:flex;flex-direction:column;position:fixed;left:var(--lw,420px);right:0;top:0;bottom:0;z-index:1;border-left:1px solid var(--line)}
  #art .in{flex:1;width:100%;max-width:none;padding:24px 36px 80px}
  #art .in:empty::before{content:'Select an article from the list.';display:block;margin-top:30vh;text-align:center;color:var(--dim);font:16px system-ui,sans-serif}
  #art:not(.on) #tb{display:none}
  #tb{position:sticky;left:auto;right:auto;bottom:0}
  #art .hint{display:none}
  html.tbt #tb{order:-1;padding-top:0}
  html.tbt #art .in{padding-top:24px}
  #list article{cursor:pointer}
  #list article.sel{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
  #sheet .pn{max-width:520px;width:100%;left:50%;right:auto;transform:translateX(-50%)}
  #fsheet .pn{max-width:520px;width:100%;left:50%;right:auto;transform:translateX(-50%)}
}

#fsheet #fq{width:100%;height:auto;padding:12px;font:16px system-ui,sans-serif;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 8px}
#fsheet .fh{margin:10px 0 0;font:700 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
#fsheet .row{display:flex;gap:10px;margin-top:10px}
#fsheet #fclear{flex:0 0 auto;padding:12px 18px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font:600 16px system-ui,sans-serif}
#fsheet #fgo{flex:1;display:flex;justify-content:center;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--bg)}
#fsheet #fgo svg{display:block;width:26px;height:26px}
/* filter popup: taller, smaller text; only the category list scrolls, the field and buttons stay visible */
#fsheet .pn{max-height:calc(var(--vh,100vh) - 24px);overflow:hidden;gap:2px}
#fsheet #flabs{flex:1;min-height:0;overflow-y:auto}
#fsheet label{font-size:14px;padding:5px 4px;gap:10px}
#fsheet label input{width:18px;height:18px}
#fsheet .fh{margin-top:8px;font-size:11px}
/* expandable categories in the filter popup (individual feeds) */
#fsheet .fcat{display:flex;align-items:center}
#fsheet .fcat label{flex:1;min-width:0}
#fsheet .fexp{flex:none;background:none;border:0;padding:2px 8px;color:var(--dim);transition:transform .15s}
#fsheet .fexp svg{display:block;width:22px;height:22px}
#fsheet .fcat.open .fexp{transform:rotate(90deg);color:var(--acc)}
#fsheet .ffeeds{padding-left:28px}
#fsheet .ffeeds label span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#srch.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-radius:10px}
</style>
</head>
<body>
<form id="login">
  <b>FreshRSS login</b>
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="p" type="password" placeholder="API password" autocomplete="current-password">
  <button>Sign in</button>
</form>
<div id="left"><header id="hd" hidden><div id="views"><button id="vu" class="vb on" aria-label="Unread"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg><span id="count" hidden></span></button><button id="vr" class="vb" aria-label="Read"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.99 8c0-.72-.37-1.35-.94-1.7L12 1 2.95 6.3C2.38 6.65 2 7.28 2 8v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2l-.01-10zM12 13L3.74 7.84 12 3l8.26 4.84L12 13z"/></svg></button><button id="vs" class="vb" aria-label="Starred"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button></div><small id="ver">v66</small><button class="ic" id="srch" aria-label="Search and filter"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button><button class="ic" id="top" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button><button class="ic" id="gear" aria-label="Options"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button></header>
<main id="list" hidden></main>
<div id="end" hidden>
  <div id="sp"></div>
  <button id="sync" aria-label="Mark as read, sync and refresh"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg><span class="pl">+</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg><span class="pl">+</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
  <p>Or pull up from the bottom of the list.</p>
</div>
</div>
<div id="split"></div>
<div id="bar"></div>
<div id="tbar"></div>
<div id="load"></div>
<div id="opts"><div class="obar"><button class="ic" id="oback" aria-label="Back"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button><b>Options</b></div>
  <div class="obody">
    <label class="opt"><span><b>Mark as read when scrolling</b><small>Articles that scroll past the top of the screen are marked as read. Otherwise, they are only marked when opened or with the sync button.</small></span><input type="checkbox" class="tgl" id="o-scroll"></label>
    <div class="opt"><span><b>List toolbar</b><small>Position of the bar with the views, search, refresh and options.</small></span><div class="seg" data-o="listBar"><button data-v="top">Top</button><button data-v="bottom">Bottom</button></div></div>
    <div class="opt"><span><b>Article toolbar</b><small>Position of the bar with star, open, share and labels.</small></span><div class="seg" data-o="artBar"><button data-v="top">Top</button><button data-v="bottom">Bottom</button></div></div>
    <label class="opt"><span><b>Notifications</b><small>Get notified of new unread articles while the app is in the background or closed. Requires the Docker container.</small></span><input type="checkbox" class="tgl" id="o-notif"></label>
    <div class="opt" id="o-ivrow"><span><b>Check every</b><small>How often the server looks for new articles.</small></span><select id="o-iv"><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option><option value="180">3 hours</option></select></div>
  </div>
</div>
<div id="art"><div class="in"></div>

<script>
const $=s=>document.querySelector(s),ls=localStorage;
const R=location.origin+'/api/greader.php/reader/api/0/',READ='user/-/state/com.google/read';
let auth=ls.auth||'',tok='',items=[],timer,busy=false,lastSync=0,view='unread',unreadN=0;
const pending=new Set(JSON.parse(ls.pending||'[]'));
const save=()=>ls.pending=JSON.stringify([...pending]);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};

async function api(url,o={}){
  o.headers={...o.headers,Authorization:'GoogleLogin auth='+auth};
  const r=await fetch(url,o);
  if(r.status==401){showLogin();throw Error('auth')}
  if(!r.ok)throw Error(r.status);
  return r;
}
function showLogin(){auth='';delete ls.auth;$('#login').style.display='flex';HTML.classList.remove('ready');['#hd','#list','#end'].forEach(s=>$(s).hidden=true)}
$('#login').onsubmit=async e=>{
  e.preventDefault();
  try{
    const r=await fetch(location.origin+'/api/greader.php/accounts/ClientLogin',{method:'POST',body:new URLSearchParams({Email:$('#u').value,Passwd:$('#p').value})});
    if(!r.ok)throw 0;
    auth=(await r.text()).match(/Auth=(.+)/)[1].trim();ls.auth=auth;
    $('#login').style.display='none';$('#p').value='';refresh();pushSync();
  }catch{toast('Invalid credentials')}
};

async function flush(){
  if(!pending.size||!auth)return;
  const ids=[...pending];
  try{
    if(!tok)tok=(await(await api(R+'token')).text()).trim();
    const b=new URLSearchParams({T:tok,a:READ});ids.forEach(i=>b.append('i',i));
    await api(R+'edit-tag',{method:'POST',body:b});
    ids.forEach(i=>pending.delete(i));save();
  }catch{tok=''}
}
function markRead(id,el){
  readSess.add(id);
  el&&el.classList.add('read');
  if(!(pending.has(id)||el&&el.dataset.done)){
    if(el)el.dataset.done=1;
    pending.add(id);save();
    clearTimeout(timer);timer=setTimeout(flush,3000);
  }
  updateCount();
}
/* "unread" button badge: displayed cards not yet marked read (value kept when switching views) */
const updateCount=()=>{
  if(view=='unread')unreadN=document.querySelectorAll('#list article:not(.read)').length;
  const c=$('#count');c.textContent=unreadN||'';c.hidden=!unreadN;
};
document.addEventListener('visibilitychange',()=>{
  pushSeen();
  if(document.hidden){clearTimeout(timer);flush();return}
  /* back in the app: sync + refresh if the list is empty, all read or scrolled to the top; otherwise (list scrolled or article open),
     "soft" sync: only grey out articles read elsewhere in the meantime, without touching the list or the scroll position */
  if(!auth||view!='unread'||Date.now()-lastSync<=10000)return;
  if(!location.hash&&(scrolledTop()||!document.querySelector('#list article:not(.read)')))refresh();
  else softSync();
});

let io;
function makeIO(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(view=='unread'&&opts.markScroll&&!e.isIntersecting&&e.boundingClientRect.top<0)markRead(e.target.dataset.id,e.target);
  }),{root:wide()?$('#left'):null,rootMargin:opts.listBar=='bottom'?'0px':'-48px 0px 0px 0px'});
}

function clean(h){
  const t=document.createElement('template');t.innerHTML=h;
  t.content.querySelectorAll('script,style,iframe,object,embed,form').forEach(n=>n.remove());
  t.content.querySelectorAll('*').forEach(n=>{
    [...n.attributes].forEach(a=>{if(a.name=='style'||/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)});
    if(n.tagName=='A'){n.target='_blank';n.rel='noopener'}
  });
  return t.innerHTML;
}
const EXCERPT=160; /* maximum number of characters of the article start shown in the list */
function excerpt(it){
  const t=document.createElement('template');
  t.innerHTML=(it.summary&&it.summary.content)||(it.content&&it.content.content)||'';
  t.content.querySelectorAll('script,style,figure,figcaption,picture,svg,iframe,table').forEach(n=>n.remove());
  const x=t.content.textContent.replace(/\s+/g,' ').trim();
  return x.length>EXCERPT?x.slice(0,EXCERPT).replace(/\s+\S*$/,'')+'…':x;
}
function thumb(it){
  const base=(it.canonical&&it.canonical[0]&&it.canonical[0].href)||location.href;
  const t=document.createElement('template');
  t.innerHTML=(it.summary&&it.summary.content)||(it.content&&it.content.content)||'';
  const abs=u=>{try{return new URL(u,base).href}catch{return ''}};
  for(const im of t.content.querySelectorAll('img')){
    const s=im.getAttribute('data-src')||im.getAttribute('data-lazy-src')||im.getAttribute('src');
    if(!s||s.startsWith('data:'))continue;
    if(+im.getAttribute('width')<=3&&im.hasAttribute('width')||+im.getAttribute('height')<=3&&im.hasAttribute('height'))continue;
    const u=abs(s);if(u)return u;
  }
  const e=(it.enclosure||[]).find(x=>/^image/.test(x.type||''));
  return e&&e.href?abs(e.href):'';
}
function render(){
  const l=$('#list');l.textContent='';io.disconnect();
  if(!items.length&&(view!='unread'||filtOn())){const p=document.createElement('p');p.className='empty';p.textContent=filtOn()?'No results.':'No articles.';l.append(p)}
  items.forEach((it,i)=>{
    const a=document.createElement('article');a.dataset.id=it.id;a.dataset.i=i;
    const b=document.createElement('b');b.textContent=it.title||'(untitled)';
    const s=document.createElement('small');
    s.textContent=(it.origin&&it.origin.title||'')+' · '+new Date(it.published*1000).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
    const tx=document.createElement('div');tx.className='t';const xt=excerpt(it),ex=document.createElement('div');ex.className='ex';ex.textContent=xt;
    if(xt)tx.append(b,ex,s);else tx.append(b,s);
    a.append(tx);if(has(it,STAR))a.classList.add('starred');
    const u=thumb(it);
    if(u){const im=new Image();im.className='th';im.loading='lazy';im.decoding='async';im.referrerPolicy='no-referrer';im.alt='';im.onerror=()=>im.remove();im.src=u;a.prepend(im)}
    l.append(a);io.observe(a);
  });
  updateCount();
}
$('#list').onclick=e=>{if(swiped)return;const a=e.target.closest('article');if(a){const h='#a/'+a.dataset.i;if(wide()){history.replaceState(null,'',h);route()}else location.hash=h}};

/* star and labels */
const STAR='user/-/state/com.google/starred',LBL='user/-/label/';
let cur=null,labels=null;
const has=(it,t)=>(it.categories||[]).includes(t);
function setTag(it,t,on){const c=it.categories=(it.categories||[]).filter(x=>x!==t);if(on)c.push(t)}
async function tag(id,add,rem){
  for(let n=0;n<2;n++){
    try{
      if(!tok)tok=(await(await api(R+'token')).text()).trim();
      const b=new URLSearchParams({T:tok});
      add.forEach(x=>b.append('a',x));rem.forEach(x=>b.append('r',x));b.append('i',id);
      await api(R+'edit-tag',{method:'POST',body:b});return true;
    }catch{tok=''}
  }
  return false;
}
async function loadLabels(){
  if(labels)return;
  try{const d=await(await api(R+'tag/list?output=json')).json();labels=d.tags.filter(t=>t.type=='tag').map(t=>t.id)}catch{}
}
const IC={star:'M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z',starOn:'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z',lab:'M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16zM16 17H5V7h11l3.55 5L16 17z',labOn:'M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z'};
function updateTb(){
  if(!cur)return;
  const u=cur.canonical&&cur.canonical[0]&&cur.canonical[0].href;
  $('#open').hidden=!u;$('#share').hidden=!u;if(u)$('#open').href=u;
  const s=has(cur,STAR);
  $('#starp').setAttribute('d',s?IC.starOn:IC.star);$('#star').classList.toggle('on',s);
  const n=labels?labels.filter(l=>has(cur,l)).length:0;
  $('#labp').setAttribute('d',n?IC.labOn:IC.lab);$('#lab').classList.toggle('on',n>0);
}
$('#share').onclick=async()=>{
  const u=cur&&cur.canonical&&cur.canonical[0]&&cur.canonical[0].href;if(!u)return;
  try{
    if(navigator.share)await navigator.share({title:cur.title||'',url:u});
    else{await navigator.clipboard.writeText(u);toast('Link copied')}
  }catch(e){if(!e||e.name!='AbortError')toast('Sharing failed')}
};
function paintStar(it,t){
  if(t!==STAR)return;
  const a=document.querySelector('#list article[data-id="'+it.id+'"]');
  if(a)a.classList.toggle('starred',has(it,STAR));
}
async function change(it,t,on,undo){
  setTag(it,t,on);updateTb();paintStar(it,t);
  if(!await tag(it.id,on?[t]:[],on?[]:[t])){setTag(it,t,!on);updateTb();paintStar(it,t);if(undo)undo();toast('Failed, try again')}
}
$('#star').onclick=()=>cur&&change(cur,STAR,!has(cur,STAR));
async function openSheet(it,top){
  $('#sheet').classList.toggle('top',!!top);
  if(!it)return;
  $('#sheet .pn>b').textContent='Labels · '+(it.title||'');
  await loadLabels();
  const box=$('#labs');box.textContent='';
  if(!labels||!labels.length)box.textContent='No labels. Create some in FreshRSS.';
  else labels.forEach(id=>{
    const l=document.createElement('label'),c=document.createElement('input');
    c.type='checkbox';c.checked=has(it,id);
    c.onchange=()=>{const on=c.checked;change(it,id,on,()=>c.checked=!on)};
    l.append(c,document.createTextNode(id.slice(LBL.length)));box.append(l);
  });
  $('#sheet').classList.add('on');
}
$('#lab').onclick=()=>openSheet(cur,opts.artBar=='top');
$('#close').onclick=$('#sheet .bk').onclick=()=>$('#sheet').classList.remove('on');

let lastId=null,savedTop=0;
function route(){
  const o=location.hash=='#options';
  $('#opts').classList.toggle('on',o);
  if(o)return;
  const m=location.hash.match(/^#a\/(\d+)$/),v=$('#art');
  if(!m||!items[m[1]]){if(v.classList.contains('on'))savedTop=v.scrollTop;v.classList.remove('on');$('#sheet').classList.remove('on');selectCard(null);if(wide()){v.firstElementChild.textContent='';lastId=null;cur=null}return}
  const it=items[m[1]],c=v.firstElementChild;
  if(it.id===lastId){v.classList.add('on');v.scrollTop=savedTop;updateTb();selectCard(m[1]);return}
  lastId=it.id;cur=it;selectCard(m[1]);
  c.textContent='';
  const h=document.createElement('h1'),url=it.canonical&&it.canonical[0]&&it.canonical[0].href;
  if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=it.title||'';h.append(a)}
  else h.textContent=it.title||'';
  const meta=document.createElement('div');meta.className='meta';
  const link=document.createElement('a');link.href=(it.canonical&&it.canonical[0]&&it.canonical[0].href)||'#';link.target='_blank';link.rel='noopener';
  link.textContent=(it.origin&&it.origin.title)||'Open source';
  meta.append(link);
  const body=document.createElement('div');body.innerHTML=clean((it.summary&&it.summary.content)||(it.content&&it.content.content)||'');
  /* if the chosen <source> (e.g. the 2x version) is broken, fall back to the <img> */
  body.querySelectorAll('picture img').forEach(im=>im.addEventListener('error',()=>im.parentNode.querySelectorAll('source').forEach(x=>x.remove()),{once:true}));
  const hint=document.createElement('p');hint.className='hint';hint.textContent='Pull up to go back to the list';
  c.append(h,meta,body,hint);v.classList.add('on');v.scrollTop=0;
  updateTb();loadLabels().then(updateTb);
  if(!has(it,'user/-/state/com.google/read'))markRead(it.id,document.querySelector('#list article[data-i="'+m[1]+'"]'));
}
addEventListener('hashchange',route);

/* any article that has already appeared on screen (or above it) counts as seen */
const markSeen=()=>document.querySelectorAll('#list article:not(.read)').forEach(a=>{if(a.getBoundingClientRect().top<seenLimit())markRead(a.dataset.id,a)});
/* soft sync: fetch the ids of articles still unread on the server and grey out those read elsewhere */
const idNum=x=>{const t=String(x).replace(/^.*\//,'');return BigInt(/^00[0-9a-f]{14}$/i.test(t)?'0x'+t:t)};
async function softSync(){
  if(busy||!auth||view!='unread')return;
  busy=true;lastSync=Date.now();HTML.classList.add('loading');
  try{
    await flush();
    const N=1000;
    const d=await(await api(R+'stream/items/ids?output=json&s=user/-/state/com.google/reading-list&xt='+READ+'&n='+N)).json();
    const refs=(d.itemRefs||[]).map(r=>idNum(r.id));
    const unread=new Set(refs.map(String));
    const oldest=refs.length>=N?refs.reduce((a,b)=>a<b?a:b):null;   /* truncated list: don't judge older articles */
    let seen=0;const gone=[];
    document.querySelectorAll('#list article:not(.read)').forEach(a=>{
      const n=idNum(a.dataset.id);
      if(unread.has(String(n)))seen++;
      else if(oldest===null||n>=oldest)gone.push(a);
    });
    if(!(seen==0&&gone.length>3)){   /* safeguard: if no displayed article is recognised, change nothing */
      gone.forEach(a=>{a.classList.add('read');a.dataset.done=1;readSess.add(a.dataset.id)});
      updateCount();
    }
  }catch(e){}
  busy=false;HTML.classList.remove('loading');
}

/* the three views: unread (default), read, starred */
const VIEWS={
  unread:['vu','stream/contents/reading-list?output=json&n=200&xt='+READ],
  read:['vr','stream/contents/user/-/state/com.google/reading-list?output=json&n=300&xt=user/-/state/com.google/unread'],
  starred:['vs','stream/contents/user/-/state/com.google/starred?output=json&n=100']
};
function setView(v){
  if(v==view){toTop();return}
  view=v;
  for(const k in VIEWS)$('#'+VIEWS[k][0]).classList.toggle('on',k==v);
  const go=()=>busy?setTimeout(go,200):refresh(false);go();
}
$('#vu').onclick=()=>setView('unread');$('#vr').onclick=()=>setView('read');$('#vs').onclick=()=>setView('starred');
async function refresh(mark=true){
  if(busy||!auth)return;busy=true;lastSync=Date.now();HTML.classList.add('loading');
  const v=view;
  if(mark&&v=='unread')markSeen();
  $('#sync').disabled=true;
  try{
    await flush();
    const d=await(await api(R+VIEWS[v][1])).json();
    rawItems=v=='unread'?d.items.filter(i=>!pending.has(i.id))
      :v=='read'?d.items.filter(i=>(i.categories||[]).includes('user/-/state/com.google/read')).slice(0,100)
      :d.items;
    readSess.clear();
    items=rawItems.filter(matches);
    history.replaceState(null,'',location.pathname);
    $('#art').classList.remove('on');lastId=null;labels=null;route();
    ['#hd','#list','#end'].forEach(s=>$(s).hidden=false);HTML.classList.add('ready');
    $('#end').hidden=v!='unread';
    render();fitSpacer();toTop();
  }catch(e){if(e.message!='auth')toast('Sync failed')}
  busy=false;HTML.classList.remove('loading');$('#sync').disabled=false;
}
$('#sync').onclick=()=>{if(navigator.vibrate){try{navigator.vibrate(20)}catch{}}refresh()};$('#top').onclick=()=>refresh(false);
/* tapping the toolbar (outside its buttons) scrolls the list back to the top */
$('#hd').addEventListener('click',e=>{if(!e.target.closest('#top,.vb,#srch,#gear'))toTop()});

/* pull up from the bottom of the list */
const atBottom=()=>{const e=SC();return e.scrollTop+e.clientHeight>=e.scrollHeight-2};
let y0=null;
addEventListener('touchstart',e=>{y0=view=='unread'&&!location.hash&&atBottom()&&!zoomed()?e.touches[0].clientY:null},{passive:true});
addEventListener('touchmove',e=>{if(y0!=null)pull(y0-e.touches[0].clientY)},{passive:true});
addEventListener('touchend',e=>{
  if(y0!=null&&y0-e.changedTouches[0].clientY>150)refresh();
  y0=null;armed=false;$('#bar').style.width=0;
});

/* swipe a card: right = star, left = labels (vibrates at the threshold) */
let sw=null,swiped=false;
const L=$('#list');
/* touch events (not pointer events) with a non-passive touchmove: Chromium starts a vertical scroll on diagonal
   moves and then cancels the pointer, so the direction is decided in the first pixels and horizontal-ish moves
   are kept from scrolling with preventDefault (touch only: mouse drags never swipe) */
L.addEventListener('touchstart',e=>{
  const a=e.target.closest('article');
  sw=a&&e.touches.length==1&&!zoomed()?{a,x:e.touches[0].clientX,y:e.touches[0].clientY,lock:false,dir:0,full:false}:null;
},{passive:true});
L.addEventListener('touchmove',e=>{
  if(!sw)return;
  if(e.touches.length!=1){swEnd(e);return}
  const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;
  if(!sw.lock){
    if(!e.cancelable){sw=null;return}   /* the page is already scrolling */
    if(Math.abs(dy)>=Math.abs(dx)){if(Math.abs(dy)>8)sw=null;return}
    e.preventDefault();
    if(Math.abs(dx)<10)return;
    sw.lock=true;sw.dir=dx>0?1:-1;
    sw.a.classList.add(sw.dir>0?'sw':'swl');sw.a.style.transition='none';
  }
  if(e.cancelable)e.preventDefault();
  const m=Math.max(0,Math.min(dx*sw.dir,130));
  sw.a.style.transform='translateX('+m*sw.dir+'px)';
  const full=m>=90;
  if(full&&!sw.full&&navigator.vibrate){try{navigator.vibrate(20)}catch{}}
  sw.full=full;sw.a.classList.toggle('full',full);
},{passive:false});
const swEnd=e=>{
  if(!sw)return;
  const g=sw;sw=null;
  if(!g.lock)return;
  swiped=true;setTimeout(()=>swiped=false,400);
  g.a.style.transition='transform .2s';g.a.style.transform='';
  setTimeout(()=>{g.a.classList.remove('sw','swl','full');g.a.style.transition=''},220);
  const it=items[+g.a.dataset.i];
  if(e.type=='touchend'&&g.full&&it){if(g.dir>0)change(it,STAR,!has(it,STAR));else openSheet(it)}
};
L.addEventListener('touchend',swEnd);
L.addEventListener('touchcancel',swEnd);

/* pull-up progress bar + short vibration when full (if the browser allows it) */
let armed=false;
const pull=d=>{
  $('#bar').style.width=Math.min(100,Math.max(0,d/1.5))+'%';
  const full=d>150;
  if(full&&!armed&&navigator.vibrate){try{navigator.vibrate(20)}catch{}}
  $('#bar').classList.toggle('full',full);
  armed=full;
};

/* pull up at the end of an article: back to the list */
let y1=null;
const artEnd=()=>{const v=$('#art');return v.scrollTop+v.clientHeight>=v.scrollHeight-8};
const zoomed=()=>window.visualViewport&&visualViewport.scale>1.01;
$('#art').addEventListener('touchstart',e=>{y1=artEnd()&&!zoomed()?e.touches[0].clientY:null},{passive:true});
$('#art').addEventListener('touchmove',e=>{if(y1!=null)pull(y1-e.touches[0].clientY)},{passive:true});
$('#art').addEventListener('touchend',e=>{
  if(y1!=null&&y1-e.changedTouches[0].clientY>150)closeArticle();
  y1=null;armed=false;$('#bar').style.width=0;
});

/* search and filter (client-side, on already loaded articles) */
let rawItems=[],ftags=null;
const readSess=new Set();
let filt={q:'',tags:[],feeds:[]};
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function textOf(it){
  if(it._t)return it._t;
  const t=document.createElement('template');
  t.innerHTML=(it.summary&&it.summary.content)||(it.content&&it.content.content)||'';
  return it._t=norm((it.title||'')+' '+(it.origin&&it.origin.title||'')+' '+t.content.textContent);
}
function matches(it){
  if((filt.tags.length||filt.feeds.length)&&!filt.tags.some(t=>has(it,t))&&!filt.feeds.includes(it.origin&&it.origin.streamId))return false;
  if(filt.q){const T=textOf(it);for(const w of norm(filt.q).split(/\s+/).filter(Boolean))if(!T.includes(w))return false}
  return true;
}
const filtOn=()=>!!(filt.q||filt.tags.length||filt.feeds.length);
function applyFilter(){
  history.replaceState(null,'',location.pathname);route();
  items=rawItems.filter(i=>matches(i)&&!(view=='unread'&&readSess.has(i.id)));
  $('#srch').classList.toggle('on',filtOn());
  render();fitSpacer();toTop();
}
async function loadAllTags(){
  if(ftags)return;
  try{
    const d=await(await api(R+'tag/list?output=json')).json();
    const l=d.tags.filter(t=>t.id.startsWith(LBL));
    ftags={folders:l.filter(t=>t.type=='folder').map(t=>t.id),tags:l.filter(t=>t.type!='folder').map(t=>t.id),feeds:{}};
  }catch{return}
  /* feeds of each category (so they can be selected individually) */
  try{
    const d=await(await api(R+'subscription/list?output=json')).json();
    for(const f of d.subscriptions||[])for(const c of f.categories||[])(ftags.feeds[c.id]=ftags.feeds[c.id]||[]).push({id:f.id,title:f.title||f.id});
    for(const k in ftags.feeds)ftags.feeds[k].sort((a,b)=>a.title.localeCompare(b.title));
  }catch{}
}
const CHEV='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>';
function chk(attrs,text){
  const l=document.createElement('label'),c=document.createElement('input'),t=document.createElement('span');
  c.type='checkbox';Object.assign(c.dataset,attrs);t.textContent=text;l.append(c,t);return [l,c];
}
/* checked category = all its feeds; partially checked = "indeterminate" state */
function syncCat(row){
  const c=row.querySelector('input'),fs=[...row.nextElementSibling.querySelectorAll('input')],n=fs.filter(f=>f.checked).length;
  c.checked=n==fs.length;c.indeterminate=n>0&&n<fs.length;
}
async function openFilter(){
  $('#fq').value=filt.q;
  await loadAllTags();
  const box=$('#flabs');box.textContent='';
  for(const [title,ids] of [['Categories',ftags&&ftags.folders||[]],['Labels',ftags&&ftags.tags||[]]]){
    if(!ids.length)continue;
    const h=document.createElement('div');h.className='fh';h.textContent=title;box.append(h);
    ids.forEach(id=>{
      const [l,c]=chk({id},id.slice(LBL.length));c.checked=filt.tags.includes(id);
      const feeds=title=='Categories'&&ftags.feeds[id];
      if(!feeds||!feeds.length){box.append(l);return}
      const row=document.createElement('div'),exp=document.createElement('button'),sub=document.createElement('div');
      row.className='fcat';exp.type='button';exp.className='fexp';exp.innerHTML=CHEV;exp.setAttribute('aria-label','Show feeds');
      sub.className='ffeeds';sub.hidden=true;
      feeds.forEach(f=>{
        const [fl,fc]=chk({feed:f.id,cat:id},f.title);fc.checked=c.checked||filt.feeds.includes(f.id);
        fc.onchange=()=>syncCat(row);sub.append(fl);
      });
      c.onchange=()=>{sub.querySelectorAll('input').forEach(f=>f.checked=c.checked);c.indeterminate=false};
      exp.onclick=()=>{sub.hidden=!sub.hidden;row.classList.toggle('open',!sub.hidden)};
      row.append(l,exp);box.append(row,sub);syncCat(row);
      if(c.indeterminate){sub.hidden=false;row.classList.add('open')}
    });
  }
  $('#fsheet').classList.add('on');
  if(matchMedia('(pointer:fine)').matches)$('#fq').focus();
}
const closeFilter=()=>$('#fsheet').classList.remove('on');
function confirmFilter(){
  /* fully checked category -> filter on the category; otherwise on the checked feeds */
  const on=[...document.querySelectorAll('#flabs input:checked')];
  const full=new Set(on.filter(c=>c.dataset.id).map(c=>c.dataset.id));
  filt={q:$('#fq').value.trim(),tags:[...full],feeds:on.filter(c=>c.dataset.feed&&!full.has(c.dataset.cat)).map(c=>c.dataset.feed)};
  closeFilter();applyFilter();
}
$('#srch').onclick=()=>{$('#fsheet').classList.toggle('top',opts.listBar!='bottom');openFilter()};
$('#fgo').onclick=confirmFilter;
$('#fclear').onclick=()=>{filt={q:'',tags:[],feeds:[]};closeFilter();applyFilter()};
$('#fsheet .bk').onclick=closeFilter;
$('#fq').addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();confirmFilter()}else if(e.key=='Escape')closeFilter()});

/* options (stored in the browser) */
let opts={markScroll:true,listBar:'top',artBar:'bottom',notify:false,notifyMin:10};
try{opts={...opts,...JSON.parse(ls.opts||'{}')}}catch{}
const saveOpts=()=>{ls.opts=JSON.stringify(opts)};
$('#o-scroll').checked=opts.markScroll;
$('#o-scroll').onchange=e=>{opts.markScroll=e.target.checked;saveOpts();fitSpacer()};

/* push notifications: the notifier container (under push/) checks FreshRSS and sends Web Push messages to sw.js */
const PUSH='push/';
let pushEp=null;
const bufB64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const postJson=(u,o,keep)=>fetch(PUSH+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o),keepalive:!!keep});
async function pushOn(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error('unsupported');
  const r=await fetch(PUSH+'key');if(!r.ok)throw new Error('no notifier');
  const {key}=await r.json();
  const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  /* the server key changed (e.g. its data folder was reset): subscribe again */
  if(sub&&bufB64u(sub.options.applicationServerKey)!=key){await sub.unsubscribe();sub=null}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  /* also sent on every app start, so the server always has the current token and interval */
  const s=await postJson('subscribe',{sub,auth,interval:opts.notifyMin});
  if(!s.ok)throw new Error('subscribe '+s.status);
  pushEp=sub.endpoint;
}
async function pushOff(){
  pushEp=null;
  const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
  const sub=reg&&await reg.pushManager.getSubscription();
  if(sub){postJson('unsubscribe',{endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe()}
}
/* the app was on screen: reset the server's count of new articles and clear the notification */
function pushSeen(){
  if(!pushEp)return;
  postJson('seen',{endpoint:pushEp},true).catch(()=>{});
  navigator.serviceWorker.getRegistration().then(r=>r&&r.getNotifications({tag:'unread'})).then(ns=>ns&&ns.forEach(n=>n.close())).catch(()=>{});
}
const pushSync=()=>{if(auth&&opts.notify&&'Notification' in window&&Notification.permission=='granted')pushOn().then(pushSeen).catch(()=>{})};
const showIv=()=>{$('#o-ivrow').hidden=!opts.notify};
$('#o-notif').checked=opts.notify;$('#o-iv').value=opts.notifyMin;showIv();
$('#o-notif').onchange=async e=>{
  const c=e.target;
  if(!c.checked){opts.notify=false;saveOpts();showIv();pushOff().catch(()=>{});return}
  if(!('Notification' in window)){c.checked=false;toast('Notifications not supported');return}
  if(await Notification.requestPermission()!='granted'){c.checked=false;toast('Notifications blocked by the browser');return}
  try{await pushOn();opts.notify=true;saveOpts();showIv();toast('Notifications enabled')}
  catch(err){c.checked=false;toast(err.message=='unsupported'?'Notifications not supported':'Notifications unavailable on this server')}
};
$('#o-iv').onchange=e=>{opts.notifyMin=+e.target.value;saveOpts();if(opts.notify)pushOn().catch(()=>toast('Failed, try again'))};
function applyBars(){
  const c=document.documentElement.classList;
  c.toggle('hdb',opts.listBar=='bottom');c.toggle('tbt',opts.artBar=='top');
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==opts[s.dataset.o])));
}
applyBars();
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  opts[b.closest('.seg').dataset.o]=b.dataset.v;saveOpts();applyBars();
  /* the observer margin depends on the list toolbar position */
  makeIO();document.querySelectorAll('#list article').forEach(a=>io.observe(a));fitSpacer();
});
$('#gear').onclick=()=>{location.hash='#options'};
$('#oback').onclick=()=>history.back();
addEventListener('keydown',e=>{if(e.key=='Escape'&&location.hash=='#options')history.back()});

/* pull down at the start of an article: back to the list (progress bar at the top + vibration at the threshold) */
const closeArticle=()=>{if(wide()){history.replaceState(null,'',location.pathname);route()}else history.back()};
let y2=null,armed2=false;
const topBar=d=>{
  $('#tbar').style.width=Math.min(100,Math.max(0,d/1.5))+'%';
  const full=d>150;
  if(full&&!armed2&&navigator.vibrate){try{navigator.vibrate(20)}catch{}}
  $('#tbar').classList.toggle('full',full);armed2=full;
};
$('#art').addEventListener('touchstart',e=>{
  y2=$('#art').scrollTop<=0&&e.touches.length==1&&!(window.visualViewport&&visualViewport.scale>1.01)?e.touches[0].clientY:null;
},{passive:true});
$('#art').addEventListener('touchmove',e=>{if(y2!=null)topBar(e.touches[0].clientY-y2)},{passive:true});
const downEnd=e=>{
  if(y2!=null&&e.type=='touchend'&&e.changedTouches[0].clientY-y2>150)closeArticle();
  y2=null;armed2=false;$('#tbar').style.width=0;$('#tbar').classList.remove('full');
};
$('#art').addEventListener('touchend',downEnd);
$('#art').addEventListener('touchcancel',downEnd);

/* swipe left / right in an article: next / previous article (vibrates at the threshold) */
let sx=null,sy=0,sd=0,sfull=false,slock=false;
const inEl=()=>$('#art').firstElementChild;
function hScrollable(el){
  for(;el&&el!==$('#art');el=el.parentElement){
    if(el.scrollWidth>el.clientWidth+1){const ox=getComputedStyle(el).overflowX;if(ox=='auto'||ox=='scroll')return true}
  }
  return false;
}
function step(dir){
  const i=items.indexOf(cur),n=i+dir;
  if(i<0)return;
  if(n<0||n>=items.length){toast(dir>0?'Last article':'First article');return}
  history.replaceState(null,'','#a/'+n);route();
  const c=document.querySelector('#list article[data-i="'+n+'"]');if(c)c.scrollIntoView({block:'nearest'});
}
$('#art').addEventListener('touchstart',e=>{
  if(e.touches.length!=1||(window.visualViewport&&visualViewport.scale>1.01)||hScrollable(e.target)){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;sd=0;sfull=false;slock=false;
},{passive:true});
/* non-passive, for the same reason as the list swipe: decide early and keep horizontal-ish moves from scrolling */
$('#art').addEventListener('touchmove',e=>{
  if(sx==null)return;
  if(e.touches.length!=1){if(slock){const el=inEl();el.style.transition='transform .15s';el.style.transform=''}sx=null;slock=false;return}
  const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(!slock){
    if(!e.cancelable){sx=null;return}   /* the article is already scrolling */
    if(Math.abs(dy)>=Math.abs(dx)){if(Math.abs(dy)>10)sx=null;return}
    e.preventDefault();
    if(Math.abs(dx)<12)return;
    slock=true;inEl().style.transition='none';
  }
  if(e.cancelable)e.preventDefault();
  sd=dx;inEl().style.transform='translateX('+dx*0.4+'px)';
  const full=Math.abs(dx)>=90;
  if(full&&!sfull&&navigator.vibrate){try{navigator.vibrate(20)}catch{}}
  sfull=full;
},{passive:false});
const swipeEnd=()=>{
  if(sx==null)return;
  const el=inEl();el.style.transition='transform .15s';el.style.transform='';
  const dx=sd,go=slock&&sfull;sx=null;slock=false;
  if(go)step(dx<0?1:-1);
};
$('#art').addEventListener('touchend',swipeEnd);
$('#art').addEventListener('touchcancel',()=>{if(sx!=null){const el=inEl();el.style.transition='transform .15s';el.style.transform='';sx=null;slock=false}});

/* two-column layout (wide screens): the list scrolls in #left, the article in #art */
const HTML=document.documentElement;
const mq=matchMedia('(min-width:900px)');
const wide=()=>mq.matches;
const SC=()=>wide()?$('#left'):document.scrollingElement;
const vh=()=>wide()?$('#left').clientHeight:innerHeight;
const toTop=()=>{SC().scrollTop=0};
const scrolledTop=()=>SC().scrollTop<=0;
const seenLimit=()=>(wide()?$('#left').getBoundingClientRect().bottom:innerHeight)-(opts.listBar=='bottom'?$('#hd').offsetHeight:0);
function selectCard(i){
  document.querySelectorAll('#list article.sel').forEach(a=>a.classList.remove('sel'));
  if(i!=null){const a=document.querySelector('#list article[data-i="'+i+'"]');if(a)a.classList.add('sel')}
}
function setLw(w){w=Math.max(260,Math.min(innerWidth-360,w));HTML.style.setProperty('--lw',w+'px');return w}
setLw(+ls.lw||420);
const split=$('#split');
split.addEventListener('pointerdown',e=>{e.preventDefault();split.setPointerCapture(e.pointerId);split.classList.add('drag')});
split.addEventListener('pointermove',e=>{if(split.classList.contains('drag'))ls.lw=setLw(e.clientX)});
const endDrag=()=>split.classList.remove('drag');
split.addEventListener('pointerup',endDrag);split.addEventListener('pointercancel',endDrag);
split.addEventListener('dblclick',()=>{ls.lw=setLw(420)});
function applyMode(){
  makeIO();
  document.querySelectorAll('#list article').forEach(a=>io.observe(a));
  setLw(+ls.lw||420);
  fitSpacer();route();
}
mq.addEventListener('change',applyMode);

/* below the list, the empty spacer + the button area together are about one screen tall,
   so the last article can scroll past the top of the screen (and be marked read) */
function fitSpacer(){
  /* the button is sticky: it stays below the last article, then pins to the bottom of the screen as you keep scrolling */
  const root=document.documentElement.style;
  root.setProperty('--vh',vh()+'px');root.setProperty('--bh',$('#sync').offsetHeight+'px');
  const sp=$('#sp');sp.style.height='0';
  if(items.length&&opts.markScroll)sp.style.height=Math.max(0,vh()-40-$('#end').offsetHeight)+'px';
}
addEventListener('resize',()=>{setLw(+ls.lw||420);fitSpacer()});

makeIO();
if(auth){refresh();pushSync()}else showLogin();
</script>
</body>
</html>
