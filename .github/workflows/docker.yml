# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io).
# - every push to main  -> :latest
# - version tags vX.Y.Z -> :X.Y.Z, :X.Y and :X
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    # only rebuild when a file that ends up in the image changes (path filters are ignored for tag pushes)
    paths:
      - Dockerfile
      - .dockerignore
      - server/**
      - index.html
      - sw.js
      - app.webmanifest
      - app-*.png
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io image names must be lowercase
          images: ghcr.io/${{ github.repository_owner }}/lightning-rss-reader
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Lightning RSS Reader
            org.opencontainers.image.description=Fast mobile-first reader for FreshRSS, with push notifications
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
